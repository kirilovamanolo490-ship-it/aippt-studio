<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI PPT Studio · 审稿台</title>
  <style>
    :root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#102235;background:#07121f}*{box-sizing:border-box}body{margin:0}.shell{max-width:1480px;margin:auto;padding:36px}.top{display:flex;justify-content:space-between;align-items:center;color:#e7f5f6;margin-bottom:28px}.brand{font-size:25px;font-weight:800}.brand span{color:#5eead4}.lookup{display:flex;gap:10px}.lookup input{width:310px}.lookup input,textarea{border:1px solid #cbdbe4;border-radius:12px;padding:12px 14px;font:inherit}.lookup button,.actions button,.comment button{border:0;border-radius:12px;padding:12px 18px;background:#14b8a6;color:white;font-weight:800;cursor:pointer}.panel{background:#f4f7fa;border-radius:24px;padding:28px;margin-bottom:24px;box-shadow:0 24px 80px rgba(0,0,0,.22)}.state{display:inline-flex;padding:7px 11px;border-radius:999px;background:#d8f7f4;color:#0f766e;font-weight:800}.decision{display:grid;gap:11px;margin:20px 0 4px;padding:17px 18px;border:1px solid #c8dee5;border-radius:16px;background:#fff}.decision h2{font-size:16px;margin:0;color:#173b4a}.decision-grid{display:flex;flex-wrap:wrap;gap:8px}.decision-pill{padding:7px 10px;border-radius:999px;background:#e8f5f4;color:#155e5d;font-size:14px}.decision-pill strong{color:#173b4a}.decision-reason{margin:0;color:#496879;line-height:1.55}.decision-alert{margin:0;padding:10px 12px;border-radius:10px;background:#fff0dc;color:#925500;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.slide{background:white;border:1px solid #dce7ee;border-radius:20px;overflow:hidden}.slide img,.slide video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#0b2639}.slide video{border-top:1px solid #dce7ee}.meta{padding:18px}.meta h3{margin:0 0 10px;font-size:20px}.meta p{color:#567087}.history{display:grid;gap:8px;margin:14px 0}.history div{padding:10px 12px;border-radius:10px;background:#edf4f7;color:#36566c}.history small{color:#0f766e;font-weight:800}.comment{display:grid;grid-template-columns:1fr auto;gap:10px}.comment textarea{min-height:72px;resize:vertical}.facts li{margin:8px 0;color:#46647b}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions button.secondary{background:#25465c}.empty{color:#7590a1;padding:36px;text-align:center}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:18px;flex-direction:column}.lookup input{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div class="brand">AI PPT <span>STUDIO</span> · 审稿台</div><div class="lookup"><input id="job" placeholder="输入 job id"/><button onclick="loadJob()">打开任务</button></div></div>
    <section id="summary" class="panel empty">从命令行运行 <code>aippt review &lt;job&gt;</code> 后会自动载入。</section>
    <section id="brief" class="panel" hidden></section>
    <section id="slides" class="grid"></section>
  </main>
  <script>
    const params=new URLSearchParams(location.search);if(params.get('job')){document.querySelector('#job').value=params.get('job');loadJob()}
    async function request(url,options){const response=await fetch(url,options);const body=await response.json();if(!response.ok)throw new Error(body.detail||'请求失败');return body}
    async function loadJob(){const id=document.querySelector('#job').value.trim();if(!id)return;try{const data=await request(`/api/jobs/${id}`);render(data)}catch(error){alert(error.message)}}
    function decisionCard(decision){if(!decision)return '';const pills=[['本轮处理',decision.change_mode],['表达场景',decision.presentation_form],['视觉策略',decision.visual_system]].map(([name,item])=>`<span class="decision-pill"><strong>${name}</strong>：${escapeHtml(item?.label||'待判断')}</span>`).join('');const alert=decision.needs_attention&&decision.attention?`<p class="decision-alert">${escapeHtml(decision.attention)}</p>`:'';return `<section class="decision"><h2>本轮制作判断</h2><div class="decision-grid">${pills}</div><p class="decision-reason">${escapeHtml(decision.reason||'系统正在整理本轮需求。')}</p>${alert}</section>`}
    function render(data){const summary=document.querySelector('#summary');summary.classList.remove('empty');summary.innerHTML=`<div class="state">${escapeHtml(data.state)}</div><h1>${escapeHtml(data.name)}</h1><p>${data.client?`客户：${escapeHtml(data.client)}`:'当前任务'}</p>${decisionCard(data.editorial_decision)}<div class="actions">${gateButtons(data)}</div>`;const brief=document.querySelector('#brief');if(data.brief){brief.hidden=false;brief.innerHTML=`<h2>需求摘要</h2><p>${escapeHtml(data.brief.goal)}</p><p>受众：${escapeHtml(data.brief.audience)} · 页数：${data.brief.target_pages} · 云端调用：${data.brief.cloud_allowed?'允许':'禁止'}</p><ul class="facts">${data.brief.must_include.map(item=>`<li>${escapeHtml(item)}</li>`).join('')}</ul>`}else brief.hidden=true;const slides=document.querySelector('#slides');slides.innerHTML='';if(!data.deck_plan){slides.innerHTML='<div class="panel empty">大纲和样张尚未生成。</div>';return}const visibleSlides=data.state==='prototype_review'?data.deck_plan.slides.filter(slide=>data.prototype_slide_ids.includes(slide.id)):data.deck_plan.slides;for(const slide of visibleSlides){const preview=data.state==='prototype_review'?`build/prototype-previews/${slide.id}.png`:`build/previews/${slide.id}.png`;const animated=data.animated_previews?.[slide.id];const animatedPlayer=animated?`<video controls preload="metadata" src="${data.preview_base}/${animated}"></video>`:'';const history=data.comments.filter(item=>item.slide_id===slide.id).map(item=>`<div>${escapeHtml(item.body)} <small>${escapeHtml(item.status)}</small></div>`).join('');const card=document.createElement('article');card.className='slide';card.innerHTML=`<img src="${data.preview_base}/${preview}" onerror="this.style.opacity=.15"/>${animatedPlayer}<div class="meta"><h3>${slide.id} · ${escapeHtml(slide.title)}</h3><p>${escapeHtml(slide.purpose)}</p><div class="history">${history}</div><div class="comment"><textarea placeholder="输入这一页的修改意见"></textarea><button onclick="comment(this,'${data.id}','${slide.id}')">提交</button></div></div>`;slides.appendChild(card)}}
    function gateButtons(data){const buttons=[];if(data.state==='brief_review')buttons.push(`<button onclick="approve('${data.id}','brief')">确认需求</button>`);if(data.state==='prototype_review'&&data.artifacts.prototype)buttons.push(`<button onclick="approve('${data.id}','prototype')">确认大纲与样张</button>`);if(data.state==='final_review'&&!data.approvals.final)buttons.push(`<button onclick="approve('${data.id}','final')">确认终稿</button>`);if(data.state==='final_review'&&data.approvals.final)buttons.push('<span class="state">终稿已确认 · 待 PowerPoint QA</span>');buttons.push(`<button class="secondary" onclick="loadJob()">刷新</button>`);return buttons.join('')}
    async function approve(id,gate){try{await request(`/api/jobs/${id}/approve/${gate}`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{"note":"approved in local review"}'});await loadJob()}catch(error){alert(error.message)}}
    async function comment(button,id,slideId){const textarea=button.previousElementSibling;try{await request(`/api/jobs/${id}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slide_id:slideId,body:textarea.value})});textarea.value='';button.textContent='已记录'}catch(error){alert(error.message)}}
    function escapeHtml(value){return String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))}
  </script>
</body>
</html>
